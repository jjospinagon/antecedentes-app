# Blueprint de despliegue en Render.
# En Render: New > Blueprint > conecta este repositorio > Apply.
services:
  - type: web
    name: antecedentes
    runtime: docker
    # 'free' no cobra nada y se despierta solo al abrir el enlace (~40 s la
    # primera vez). Si lo notas lento, se sube a 'starter' con un clic en el
    # panel de Render: queda encendido siempre y responde al instante.
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: REVISION_MANUAL
        value: "1"
      - key: FPS_STREAM
        value: "1.6"
      - key: ESPERA_MAX_HUMANO_S
        value: "600"
      - key: TTL_SESION_S
        value: "1800"
